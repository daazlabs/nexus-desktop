name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Como instalar

          Só precisas de um destes três, conforme o teu sistema:

          | Sistema | Ficheiro |
          |---|---|
          | macOS (Apple Silicon) | `DaazNexus-*-arm64.dmg` |
          | Windows | `DaazNexus-Setup-*.exe` |
          | Linux | `DaazNexus-*.AppImage` (portátil) ou `nexus-desktop_*.deb` |

          Os restantes ficheiros (`.blockmap`, `.yml`, e o `.zip` do Mac) não são para descarregar — são usados automaticamente pela app para aplicar atualizações em segundo plano.

          No Mac, para evitar os avisos do Gatekeeper, usa o script `install-mac.command` em vez de abrir o `.dmg` diretamente.
          EOF
          gh release create "${{ github.ref_name }}" --repo daazlabs/nexus-desktop --target "${{ github.sha }}" --draft --title "${{ github.ref_name }}" --notes-file release-notes.md \
            || gh release edit "${{ github.ref_name }}" --repo daazlabs/nexus-desktop --notes-file release-notes.md

          # Fail loudly instead of silently losing the release: without
          # fetch-depth: 0 the tag isn't resolvable locally and gh release
          # create silently produces an orphaned "untagged-<hash>" release
          # instead of one tagged "${{ github.ref_name }}" — the matrix
          # builds below then have nothing correctly tagged to upload to.
          gh release view "${{ github.ref_name }}" --repo daazlabs/nexus-desktop >/dev/null

      - name: Upload Mac install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" install-mac.command --repo daazlabs/nexus-desktop --clobber

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The local MCP connector servers (gdrive/gmail/wordpress/n8n/magnific,
      # plus the vendored Python ones for Adobe/AutoCAD) live in the *web*
      # repo, and electron-builder.yml bundles them from ../mcp-servers —
      # which exists on a dev machine but never on a runner that only checks
      # out this repo. Without this step electron-builder just logs
      # "file source doesn't exist" and ships an installer with no
      # connectors at all (the bug that shipped in <= v1.0.24).
      # actions/checkout can't write outside the workspace, so check out into
      # a temp path and move it up next to the repo.
      - name: Checkout MCP servers (web repo)
        uses: actions/checkout@v4
        with:
          repository: daazlabs/DAAZNEXUS
          token: ${{ secrets.DAAZNEXUS_TOKEN }}
          path: _mcp-src
          sparse-checkout: mcp-servers

      - name: Place MCP servers alongside this repo
        shell: bash
        run: |
          rm -rf ../mcp-servers
          mv _mcp-src/mcp-servers ../mcp-servers
          rm -rf _mcp-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only src/ and package.json are tracked for the Node servers — the
      # dist/ and node_modules/ that electron-builder bundles are build
      # output, so they have to be produced here. Dev deps (typescript) are
      # pruned afterwards so they don't ride along inside every installer.
      - name: Build MCP servers (Node)
        shell: bash
        run: |
          for d in gdrive-server gmail-server wordpress-server n8n-server magnific-server; do
            echo "== building $d"
            (cd "../mcp-servers/$d" && npm ci && npm run build && npm prune --omit=dev)
          done

      # electron-builder only *warns* about missing extraResources, so a
      # broken bundle would silently ship again. Fail here instead.
      - name: Verify MCP servers are ready to bundle
        shell: bash
        run: |
          missing=0
          for d in gdrive-server gmail-server wordpress-server n8n-server magnific-server; do
            for p in dist/index.js package.json node_modules; do
              [ -e "../mcp-servers/$d/$p" ] || { echo "MISSING: mcp-servers/$d/$p"; missing=1; }
            done
          done
          [ -e ../mcp-servers/adobe-server/mcp/ps-mcp.py ] || { echo "MISSING: mcp-servers/adobe-server/mcp/ps-mcp.py"; missing=1; }
          [ -e ../mcp-servers/autocad-server/src/server.py ] || { echo "MISSING: mcp-servers/autocad-server/src/server.py"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "Aborting: connectors would be missing from the installer."; exit 1; }
          echo "All MCP servers present."

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci
        working-directory: src/renderer

      - name: Build
        run: npm run build

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          SKIP_NOTARIZE: true
