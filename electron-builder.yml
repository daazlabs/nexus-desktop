appId: com.daazlabs.nexus-desktop
productName: DaazNexus
copyright: Copyright (C) 2025 DaazLabs

publish:
  provider: github
  owner: daazlabs
  repo: nexus-desktop
  private: false

directories:
  output: dist
  buildResources: build

files:
  - dist-electron/**/*
  - src/renderer/dist/**/*
  - package.json

# Local MCP connectors (gdrive/gmail/wordpress/n8n) are spawned as `node
# <resources>/mcp-servers/<name>/dist/index.js` — see nodeServer() in
# mcpConnectors.ts. Each needs its own compiled dist/, package.json, and
# node_modules/ (their runtime deps, e.g. @modelcontextprotocol/sdk) present
# in the packaged app, not just in the source repo.
extraResources:
  # Global skills (see src/main/tools/skills.ts) — bundled markdown recipes,
  # same for every install.
  - from: skills
    to: skills
  # OAuth "installed app" clients, one JSON per provider, written by CI from
  # repo secrets (see release.yml) — never committed. Without these the
  # Google/Canva connectors ship with no way to log in. Absent on a plain
  # local build, which is fine: loadDesktopOAuthClient() then falls back to
  # ~/.daaznexus/ as before.
  - from: build-oauth
    to: oauth-clients
    filter: ['*-desktop-client.json']
  # Copied from the *parent* directory on purpose. electron-builder hard-codes
  # `if (relative === "node_modules") return false` (app-builder-lib
  # util/filter.js) — a node_modules sitting at the root of a copied folder is
  # dropped whatever the filter says, so the per-server `from:` these used to
  # have shipped dist/ without a single dependency and every Node connector
  # died at startup with ERR_MODULE_NOT_FOUND. One level up, the path becomes
  # `<server>/node_modules` and that rule no longer applies.
  - from: ../mcp-servers
    to: mcp-servers
    filter:
      - 'gdrive-server/dist/**/*'
      - 'gdrive-server/package.json'
      - 'gdrive-server/node_modules/**/*'
      - 'gmail-server/dist/**/*'
      - 'gmail-server/package.json'
      - 'gmail-server/node_modules/**/*'
      - 'wordpress-server/dist/**/*'
      - 'wordpress-server/package.json'
      - 'wordpress-server/node_modules/**/*'
      - 'n8n-server/dist/**/*'
      - 'n8n-server/package.json'
      - 'n8n-server/node_modules/**/*'
      - 'magnific-server/dist/**/*'
      - 'magnific-server/package.json'
      - 'magnific-server/node_modules/**/*'
      - 'browser-server/dist/**/*'
      - 'browser-server/package.json'
      - 'browser-server/node_modules/**/*'
      - 'linkedin-server/dist/**/*'
      - 'linkedin-server/package.json'
      - 'linkedin-server/node_modules/**/*'
  # Adobe MCP server (vendored adb-mcp, see mcp-servers/adobe-server/
  # NOTICE.md) — pure Python source, no node_modules to bundle. Not
  # platform-gated like autocad-server below: Photoshop runs on both macOS
  # and Windows. uv, the proxy binary and the .ccx plugin installer are
  # NOT bundled here — adobeRuntime.ts downloads the right one for the
  # current platform/arch at runtime (same rationale as the AutoCAD Python
  # runtime: avoids baking every mac-arm64/mac-x64/win-x64 combination into
  # every installer).
  - from: ../mcp-servers/adobe-server
    to: mcp-servers/adobe-server
    # uxp/**/*: added for InDesign (12 Ago 2026) — adobeRuntime.ts builds its
    # .ccx from uxp/id/ at runtime (no upstream release ships one, unlike
    # Photoshop/Premiere's ccxAssetName downloads) — see NOTICE.md.
    filter: ['mcp/**/*', 'uxp/**/*', 'LICENSE', 'NOTICE.md']
  # SketchUp MCP server (vendored sketchup-mcp, see mcp-servers/sketchup-server/
  # NOTICE.md) — pure Python + one Ruby file, no node_modules. Not
  # platform-gated, same reasoning as adobe-server above: SketchUp's Ruby API
  # is cross-platform. uv is NOT bundled — sketchupRuntime.ts downloads it at
  # runtime, same as the Adobe/AutoCAD Mac connectors.
  - from: ../mcp-servers/sketchup-server
    to: mcp-servers/sketchup-server
    filter: ['src/**/*', 'sketchup_plugin/**/*', 'resources/**/*', 'LICENSE', 'NOTICE.md']

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  syncDesktopName: true

win:
  target:
    - nsis
  # AutoCAD MCP server (vendored CAD-MCP, see mcp-servers/autocad-server/
  # NOTICE.md) — pure Python source, no node_modules to bundle. Win-only:
  # COM automation (pywin32) has no macOS/Linux equivalent, and
  # autocadRuntime.ts provisions its own private Python at runtime, so
  # nothing else needs bundling alongside it.
  extraResources:
    - from: ../mcp-servers/autocad-server
      to: mcp-servers/autocad-server
      filter: ['src/**/*', 'LICENSE', 'NOTICE.md']

mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  identity: null
  gatekeeperAssess: false
  hardenedRuntime: false
  # AutoCAD MCP server, macOS branch (file-based, ezdxf — see
  # mcp-servers/autocad-mac-server/NOTICE.md and PESQUISA/r-autocad-mac.md
  # for why this is a different backend from the Windows COM one above, not
  # a port of it). Own code, not vendored — no LICENSE to bundle, unlike
  # autocad-server/adobe-server. uv and its Python/ezdxf are provisioned at
  # runtime by autocadRuntime.ts, same rationale as the win: block above.
  extraResources:
    - from: ../mcp-servers/autocad-mac-server
      to: mcp-servers/autocad-mac-server
      filter: ['src/**/*', 'requirements.txt', 'NOTICE.md']
    # Illustrator MCP server (vendored illustrator-mcp-server, see
    # mcp-servers/illustrator-server/NOTICE.md and
    # PESQUISA/r-illustrator-indesign.md). Node-based like gdrive-server
    # etc. (dist/+node_modules built by CI, see release.yml), but Mac-only
    # by decision — mcpConnectors.ts's getIllustratorConnection() hard-gates
    # on darwin regardless of what ships here, so this block existing only
    # under mac: is a second, redundant layer of the same guarantee.
    #
    # from: is the *parent* (../mcp-servers), not ../mcp-servers/illustrator-
    # server directly — same node_modules-at-root gotcha as the base
    # gdrive-server-etc. block above (electron-builder silently drops a
    # node_modules/ that sits at the copied folder's root). Learned this the
    # hard way: v1.0.40's release build failed exactly on this (see
    # "Verify the packaged app really contains the connectors").
    - from: ../mcp-servers
      to: mcp-servers
      filter:
        - 'illustrator-server/dist/**/*'
        - 'illustrator-server/package.json'
        - 'illustrator-server/node_modules/**/*'
        - 'illustrator-server/LICENSE'
        - 'illustrator-server/NOTICE.md'
